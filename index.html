<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>综合备忘录</title>
<meta name="theme-color" content="#2563EB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="备忘录">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="备忘录">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ============================================================
   设计令牌 · 柔和现代（Soft Modern）
   低饱和薰衣草主色 + 柔和粉彩点缀 + 轻盈阴影 + 大圆角
   ============================================================ */
:root{
  --bg:#f3f3fb;
  --bg-deco:linear-gradient(135deg,#F1ECFB 0%,#F6F2FF 55%,#FBF9FF 100%);
  --surface:#ffffff;
  --surface-2:#f7f8fc;
  --surface-3:#eef0f7;
  --line:#edeff6;
  --line-strong:#e2e5ef;
  --text:#2b2d44;
  --text-2:#6c7088;
  --text-3:#a6abbf;
  --primary:#2563EB;
  --primary-strong:#1E3A8A;
  --primary-soft:#E8EEFB;
  --primary-softer:#F4F8FE;
  --danger:#f1789c;
  --danger-strong:#e35f87;
  --danger-soft:#ffeaf1;
  --warning:#f0b35a;
  --warning-strong:#e09a3a;
  --warning-soft:#fff2dd;
  --success:#54c2a0;
  --success-strong:#39a888;
  --success-soft:#e1f6ef;
  /* 粉彩分类点缀 */
  --c-peach:#ffd9c2; --c-peach-ink:#d2783f;
  --c-mint:#c9efe2;  --c-mint-ink:#3f9e82;
  --c-sky:#cfe2ff;   --c-sky-ink:#4f7fd6;
  --c-lilac:#e3d6ff; --c-lilac-ink:#8a6fe0;
  --c-rose:#ffd4e6;  --c-rose-ink:#d96aa0;
  --c-amber:#ffe6b0; --c-amber-ink:#c79136;
  --shadow-xs:0 1px 2px rgba(48,50,90,.04);
  --shadow-sm:0 2px 10px rgba(48,50,90,.05);
  --shadow-md:0 8px 24px rgba(48,50,90,.08);
  --shadow-lg:0 18px 48px rgba(48,50,90,.13);
  --r-xs:12px; --r-sm:16px; --r:20px; --r-lg:26px; --r-pill:999px;
  --ease:cubic-bezier(.22,1,.36,1);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --space:4px;
}
[data-theme="dark"]{
  --bg:#14151c;
  --bg-deco:linear-gradient(135deg,#161725 0%,#1A1C2F 55%,#1F213A 100%);
  --surface:#1f212b;
  --surface-2:#25272f;
  --surface-3:#2c2e38;
  --line:#2a2c37;
  --line-strong:#353845;
  --text:#e9eaf1;
  --text-2:#a7aabd;
  --text-3:#71758a;
  --primary:#5B8DEF;
  --primary-strong:#2563EB;
  --primary-soft:#1B2542;
  --primary-softer:#131A2E;
  --danger:#f48ab0; --danger-strong:#ef6f9c; --danger-soft:#3a2430;
  --warning:#f6c574; --warning-strong:#e9a648; --warning-soft:#3a2f1f;
  --success:#6fd3b1; --success-strong:#4cbf9b; --success-soft:#1d332c;
  --c-peach:#4a3328; --c-peach-ink:#f0b088;
  --c-mint:#1c3329;  --c-mint-ink:#7fd9bd;
  --c-sky:#1f2c44;   --c-sky-ink:#8fb6f0;
  --c-lilac:#2c2444; --c-lilac-ink:#c0a8ff;
  --c-rose:#3a2433;  --c-rose-ink:#f0a0c4;
  --c-amber:#3a311f; --c-amber-ink:#ecc079;
  --shadow-xs:0 1px 2px rgba(0,0,0,.25);
  --shadow-sm:0 2px 10px rgba(0,0,0,.3);
  --shadow-md:0 8px 24px rgba(0,0,0,.38);
  --shadow-lg:0 18px 48px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-overflow-scrolling:auto}
body{
  font-family:var(--font);background:var(--bg-deco);color:var(--text);
  line-height:1.55;-webkit-tap-highlight-color:transparent;
  display:flex;justify-content:center;
  transition:background .4s var(--ease),color .4s var(--ease);
}
/* 手机框（桌面预览时呈现为设备） */
.phone{
  width:100%;max-width:none;height:100vh;height:100dvh;background:var(--bg);
  display:flex;flex-direction:column;position:relative;overflow:hidden;overscroll-behavior:none;
  transition:background .4s var(--ease);
}
@media(min-width:780px){
  body{padding:28px 0;align-items:flex-start}
  .phone{max-width:460px;height:calc(100vh - 56px);height:calc(100dvh - 56px);min-height:auto;border-radius:38px;box-shadow:var(--shadow-lg);border:1px solid var(--line)}
}
@media(min-width:780px) and (max-height:760px){
  body{padding:14px 0}.phone{height:calc(100vh - 28px);height:calc(100dvh - 28px)}
}

/* ============ 顶部栏（搜索 + 更多） ============ */
.topbar{
  display:flex;align-items:center;gap:8px;flex:none;z-index:90;position:relative;
  background:var(--primary-soft);
  border-bottom:1px solid color-mix(in srgb,var(--primary) 16%,transparent);
  padding:max(10px,env(safe-area-inset-top)) 12px 10px;
  transition:background .25s var(--ease);
}
.topbar.scrolled{background:color-mix(in srgb,var(--primary-soft) 82%, transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.top-search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-pill);padding:9px 14px;min-width:0;transition:border-color .2s var(--ease)}
.top-search:focus-within{border-color:var(--primary)}
.top-search .search-ico{color:var(--text-3);font-size:13px;flex:none}
.top-search input{border:none;background:transparent;outline:none;flex:1;font-size:16px;color:var(--text);min-width:0}
.top-search input::placeholder{color:var(--text-3)}
.menu-btn{width:38px;height:38px;flex:none;border:none;background:transparent;color:var(--text-2);font-size:18px;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s var(--ease)}
.menu-btn:hover{background:var(--surface-3);color:var(--text)}
.menu-btn:active{transform:scale(.92)}
.icon-btn{
  width:38px;height:38px;border:none;background:transparent;color:var(--text-2);
  font-size:15px;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s var(--ease);
}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}
.icon-btn:active{transform:scale(.92)}
/* ============ 滚动区 ============ */
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:none;padding-bottom:90px}
/* ============ 底部固定模块导航 ============ */
.bottom-nav{
  display:flex;align-items:stretch;justify-content:space-around;flex:none;z-index:95;
  background:var(--surface);
  border-top:1px solid var(--line);
  padding:6px 8px max(6px,env(safe-area-inset-bottom));
}
.bottom-nav .nav-item{flex:1;background:none;border:none;cursor:pointer;color:var(--text-3);display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:14px;font-size:11px;font-weight:700;transition:all .2s var(--ease)}
.bottom-nav .nav-item i{font-size:18px;transition:color .2s var(--ease)}
.bottom-nav .nav-item.active{color:var(--primary-strong)}
.bottom-nav .nav-item.active i{color:var(--primary)}
.main{max-width:780px;margin:0 auto;padding:16px 14px 8px}
.tab-panel{display:none;animation:fadeUp .35s var(--ease)}
.tab-panel.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ============ 问候卡（柔和现代的点睛） ============ */
.greet{
  background:linear-gradient(135deg,var(--primary-soft) 0%,var(--primary-softer) 100%);
  border:1px solid color-mix(in srgb,var(--primary) 14%,transparent);
  border-radius:var(--r);padding:18px 20px;margin-bottom:16px;position:relative;overflow:hidden;
}
.greet::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,rgba(37,99,235,.18),transparent 70%)}
.greet h1{font-size:19px;font-weight:800;letter-spacing:-.4px}
.greet p{font-size:12.5px;color:var(--text-2);margin-top:3px}
.greet .stat-row{display:flex;gap:8px;margin-top:14px}
.greet .stat{flex:1;background:var(--surface);border-radius:var(--r-sm);padding:10px 12px;box-shadow:var(--shadow-xs)}
.greet .stat b{font-size:18px;font-weight:800;color:var(--primary-strong);display:block;line-height:1.1}
.greet .stat span{font-size:10.5px;color:var(--text-3);font-weight:600}

/* ============ 标签云 / 分类条 ============ */
.tag-cloud{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tag-cloud:empty{display:none}
.category-bar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.category-bar:empty{display:none}
.cat-label{font-size:12px;font-weight:800;color:var(--text-2);align-self:center;margin-right:2px}
.cat-hint{font-size:11.5px;color:var(--text-3);padding:2px 0}

/* ============ 按钮 ============ */
.btn{
  padding:10px 18px;border:none;border-radius:var(--r-pill);font-size:13.5px;font-weight:700;
  cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .2s var(--ease);white-space:nowrap;letter-spacing:.2px;
}
.btn-primary{background:linear-gradient(135deg,#2563EB 0%,#5B8DEF 100%);color:#fff;box-shadow:0 6px 18px rgba(37,99,235,.4)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(37,99,235,.42)}
.btn-primary:active{transform:scale(.97)}
.btn-outline{background:var(--surface);color:var(--text);border:1.5px solid var(--line-strong)}
.btn-outline:hover{background:var(--surface-2);border-color:var(--primary);color:var(--primary-strong)}
.btn-outline.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 4px 12px rgba(37,99,235,.28)}
.btn-sm{padding:7px 14px;font-size:12px}
.btn-danger{background:var(--danger);color:#fff;box-shadow:0 4px 12px rgba(241,120,156,.25)}
.btn-danger:hover{background:var(--danger-strong)}
.btn-ghost{background:transparent;color:var(--text-2);padding:7px 10px}
.btn-ghost:hover{color:var(--text);background:var(--surface-3)}

/* ============ 卡片 ============ */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 16px;margin-bottom:12px;box-shadow:var(--shadow-xs);
  transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s var(--ease);
  position:relative;overflow:hidden;
}
.card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:4px;
  background:linear-gradient(180deg,var(--primary),#c9bcd3);opacity:0;transition:opacity .25s var(--ease)}
.card:active{transform:scale(.98)}
@media(hover:hover){.card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:transparent}.card:hover::before{opacity:1}}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card-title{font-size:14.5px;font-weight:700;line-height:1.35}
.card-meta{font-size:11px;color:var(--text-3);margin-top:5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card-body{font-size:13px;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:9px;line-height:1.55}
.card-actions{display:flex;gap:2px;flex-shrink:0;opacity:.5;transition:opacity .2s var(--ease)}
.card:active .card-actions{opacity:1}
@media(hover:hover){.card:hover .card-actions{opacity:1}}
.card-actions .icon-btn{width:32px;height:32px;font-size:13px;border-radius:10px}
.card-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}

/* ============ 标签 ============ */
.tag{
  display:inline-flex;align-items:center;gap:3px;padding:4px 11px;
  background:var(--primary-soft);color:var(--primary-strong);border-radius:var(--r-pill);
  font-size:11px;font-weight:700;cursor:pointer;transition:all .2s var(--ease);user-select:none;border:1px solid transparent;
}
.tag:hover{filter:brightness(.97);transform:translateY(-1px)}
.tag.selected{background:var(--primary);color:#fff;box-shadow:0 3px 9px rgba(37,99,235,.32)}
.tag .tag-remove{font-size:10px;opacity:.6;margin-left:1px;font-weight:800}
.tag .tag-remove:hover{opacity:1}
.category-chip{
  padding:6px 15px;border:1.5px solid var(--line-strong);border-radius:var(--r-pill);
  font-size:12px;cursor:pointer;background:var(--surface);color:var(--text-2);transition:all .2s var(--ease);user-select:none;font-weight:600;
}
.category-chip:hover{background:var(--surface-2);border-color:var(--primary);color:var(--primary-strong)}
.category-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 3px 9px rgba(37,99,235,.28)}
.category-chip.add{color:var(--primary-strong);border-style:dashed;border-color:var(--primary);opacity:.85}
.category-chip .cat-del{margin-left:5px;opacity:.5;font-size:10px;cursor:pointer}
.category-chip .cat-del:hover{opacity:1}

/* ============ 银行分组 ============ */
.bank-group{margin-bottom:22px}
.bank-group-title{
  font-size:13px;font-weight:800;color:var(--primary-strong);padding:6px 4px;margin-bottom:12px;
  display:flex;align-items:center;gap:8px;letter-spacing:.3px;
}
.bank-group-title i{font-size:15px;opacity:.75;background:var(--primary-soft);color:var(--primary-strong);
  width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.bank-group-title .count{font-size:11px;color:var(--text-3);font-weight:600;margin-left:2px}
.filter-tag{font-size:11px;font-weight:700;color:var(--text-3);flex:none;white-space:nowrap}
.ocr-loading{position:fixed;inset:0;z-index:500;background:rgba(255,255,255,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.ocr-loading p{font-size:13px;font-weight:700;color:var(--text-2)}
.ocr-spin{width:38px;height:38px;border:4px solid var(--line-strong);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
[data-theme="dark"] .ocr-loading{background:rgba(20,22,40,.72)}
.bank-card{position:relative;padding:12px 14px;margin-bottom:9px}
.bank-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent,var(--line-strong));border-radius:var(--r) 0 0 var(--r)}
.bank-card.expiring{background:linear-gradient(135deg,var(--warning-soft) 0%,var(--surface) 70%)}
.bank-card.expired{background:linear-gradient(135deg,var(--danger-soft) 0%,var(--surface) 70%);opacity:.92}
.bank-card.expiring::before{background:var(--warning)}
.bank-card.expired::before{background:var(--danger)}
.bank-card.billing-soon{background:linear-gradient(135deg,var(--warning-soft) 0%,var(--surface) 90%)}
.bank-card.billing-soon::before{background:var(--warning)}
.bank-card.bill-due{background:linear-gradient(135deg,var(--warning-soft) 0%,var(--surface) 78%)}
.bank-card.bill-due::before{background:var(--warning-strong)}
.bill-remind{background:linear-gradient(135deg,#FFF8ED,#FFFBF5);border:1px solid #FCE8CF;border-radius:var(--r-lg);padding:12px 14px;margin-bottom:14px}
.br-head{display:flex;align-items:center;gap:7px;font-weight:800;font-size:13.5px;color:var(--text)}
.br-head i{color:var(--warning-strong)}
.br-sub{font-size:11px;font-weight:600;color:var(--text-3);margin-left:auto}
.br-item{display:flex;align-items:center;gap:9px;padding-top:10px;cursor:pointer;transition:opacity .15s}
.br-item:hover{opacity:.78}
.br-dot{width:8px;height:8px;border-radius:50%;flex:none}
.br-info{flex:1;min-width:0;font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br-info b{color:var(--text)}
.br-days{font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:var(--r-pill);white-space:nowrap}
.br-days.warning{background:var(--warning-soft);color:var(--warning-strong)}
.br-days.danger{background:var(--danger-soft);color:var(--danger-strong)}
.bank-card .b-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bank-card .b-owner{font-weight:800;font-size:13.5px;color:var(--text)}
.bank-card .b-type{font-size:11px;color:var(--text-3);font-weight:700}
.bank-card .b-bill{font-size:10.5px;font-weight:700;color:var(--primary-strong);background:var(--primary-soft);padding:2px 8px;border-radius:var(--r-pill)}
.bank-card .b-bot{display:flex;align-items:center;gap:10px 14px;margin-top:7px;flex-wrap:wrap}
.bank-card .b-num{font-family:"SF Mono","JetBrains Mono","Fira Code",monospace;font-size:13px;letter-spacing:.5px;color:var(--text);font-weight:700}
.bank-card .b-meta{font-size:11.5px;color:var(--text-2);font-weight:600}
.bank-card .b-meta b{color:var(--text-3);font-weight:700;margin-right:4px}
.copyable{cursor:pointer;border-radius:6px;transition:background .15s,color .15s;user-select:none}
.copyable:hover{color:var(--primary)}
.bank-card .b-num.copyable{display:inline-flex;align-items:center;gap:6px;padding:2px 6px;margin:-2px -6px}
.bank-card .b-num.copyable:hover{background:var(--primary-soft)}
.bank-card .b-copy{font-size:12px;opacity:.5;transition:opacity .15s,color .15s}
.bank-card .b-num.copyable:hover .b-copy{opacity:1;color:var(--primary)}
.bank-card .b-cvc{cursor:pointer;display:inline-flex;align-items:center;gap:5px;user-select:none}
.bank-card .b-cvc:hover{color:var(--primary)}
.bank-card .b-eye{font-size:11px;opacity:.6;transition:opacity .15s}
.bank-card .b-remark{flex-basis:100%;margin-top:2px;color:var(--text-2)}
.bank-card .card-actions{opacity:1}
.bank-card .alert-badge{display:inline-flex;align-items:center;font-size:10px;padding:2px 9px;border-radius:var(--r-pill);font-weight:800;color:#fff;margin-left:4px;letter-spacing:.2px}
.bank-card .alert-badge.danger{background:var(--danger)}
.bank-card .alert-badge.warning{background:var(--warning-strong)}
.bank-card.repaid::before{background:var(--accent,var(--line-strong))}
.repaid-btn{border:1.5px solid var(--primary);background:var(--surface);color:var(--primary-strong);font-size:11px;font-weight:700;padding:5px 10px;border-radius:var(--r-pill);cursor:pointer;white-space:nowrap;transition:all .18s var(--ease);flex:none}
.repaid-btn.on{background:var(--success-strong);border-color:var(--success-strong);color:#fff}
/* 详情页 / 图片上传 / 列表点击态 */
.detail-screen{position:absolute;inset:0;background:var(--bg);z-index:120;display:none;flex-direction:column;overflow:hidden}
.detail-screen.active{display:flex;animation:fadeUp .3s var(--ease)}
.detail-screen .detail-bar{margin:0;padding:max(14px,env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line);background:var(--surface);flex:none}
.detail-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:none;padding:8px 18px max(22px,env(safe-area-inset-bottom))}
.detail-bar{display:flex;align-items:center;gap:10px;margin:-4px 0 16px}
.detail-bar .detail-title{font-weight:800;font-size:16px;color:var(--text)}
.detail-bar .icon-btn{width:34px;height:34px;border-radius:11px;background:var(--surface-2);color:var(--text-2);font-size:14px}
.detail-view{padding:2px 2px 4px}
.detail-h{font-size:19px;font-weight:800;color:var(--text);margin:0 0 12px;line-height:1.35;word-break:break-word}
.detail-content{font-size:15px;line-height:1.75;color:var(--text);white-space:pre-wrap;word-break:break-word}
.detail-time{margin-top:18px;font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:6px}
.detail-bank-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.detail-bank-head .b-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.detail-bank-head .detail-h{margin:0}
.kv-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:11px 2px;border-bottom:1px solid var(--line)}
.kv-row:last-child{border-bottom:none}
.kv-k{font-size:13.5px;color:var(--text-3);font-weight:600;white-space:nowrap}
.kv-v{font-size:15px;color:var(--text);font-weight:700;text-align:right;word-break:break-all}
.detail-imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.detail-img{width:96px;height:96px;border-radius:12px;object-fit:cover;border:1px solid var(--line);cursor:zoom-in;transition:transform .15s var(--ease),box-shadow .15s var(--ease)}
.detail-img:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.detail-img:active{transform:scale(.97)}
.img-viewer{position:fixed;inset:0;z-index:350;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:rgba(18,19,26,.94);cursor:zoom-out;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.img-viewer.active{display:flex;animation:fadeUp .2s var(--ease)}
.iv-img{max-width:100%;max-height:78vh;border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.iv-cap{color:#fff;font-size:13px;font-weight:600;background:rgba(255,255,255,.14);padding:7px 16px;border-radius:999px;letter-spacing:.3px}
.memo-card,.note-card{position:relative;cursor:pointer;padding-right:30px;transition:transform .14s var(--ease),box-shadow .14s var(--ease)}
.memo-card:active,.note-card:active{transform:scale(.99)}
.memo-card .card-body,.note-card .card-body{margin-top:7px;-webkit-line-clamp:1}
.memo-go,.note-go{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:13px;pointer-events:none}
.memo-card .memo-pin{position:absolute;top:8px;right:8px;width:26px;height:26px;border:none;background:transparent;color:var(--text-3);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:background .15s,color .15s,transform .1s}
.memo-card .memo-pin:active{transform:scale(.88)}
.memo-card .memo-pin:hover{background:var(--surface-3);color:var(--primary)}
.memo-card.pinned{border-color:var(--primary);background:var(--primary-soft)}
.memo-card .pin-flag{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--primary);border-radius:var(--r-sm) 0 0 var(--r-sm)}
.trash-list{display:flex;flex-direction:column;gap:9px;max-height:54vh;overflow:auto;margin-top:8px}
.trash-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.trash-main{flex:1;min-width:0}
.trash-btns{display:flex;gap:6px;flex:none}
.b-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;margin-right:2px}
.b-type-pill{font-size:10.5px;font-weight:700;color:var(--accent,var(--text-2));background:var(--surface-3);border:1px solid var(--accent,var(--line));padding:1px 8px;border-radius:var(--r-pill)}
.img-list{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.img-btns{display:flex;gap:8px;flex-wrap:wrap}
.img-thumb{position:relative;width:66px;height:66px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.img-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.img-thumb .img-del{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;border:none;background:rgba(30,32,55,.6);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.card-imgs{display:flex;gap:6px;margin-top:9px;align-items:center}
.card-img-thumb{width:46px;height:46px;border-radius:9px;object-fit:cover;border:1px solid var(--line)}
.card-img-more{font-size:11px;color:var(--text-3);font-weight:700}

/* ============ 模态框 ============ */
.modal-overlay{position:fixed;inset:0;background:rgba(30,32,55,.42);z-index:200;display:flex;align-items:flex-start;justify-content:center;overscroll-behavior:contain;
  animation:fade .2s ease;padding:calc(env(safe-area-inset-top) + 8px) 0 0}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  position:relative;background:var(--surface);border-radius:0 0 var(--r-lg) var(--r-lg);box-shadow:var(--shadow-lg);
  width:100%;max-width:460px;max-height:calc(100vh - env(safe-area-inset-top) - 8px);overflow-y:auto;overscroll-behavior:contain;padding:22px 20px max(22px,env(safe-area-inset-bottom));
  animation:sheetUp .35s var(--ease);
}
@keyframes sheetUp{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:translateY(0)}}
.modal h3{font-size:17px;margin-bottom:18px;display:flex;align-items:center;gap:9px;font-weight:800;padding-right:42px}
.modal h3 i{background:var(--primary-soft);color:var(--primary-strong);padding:8px;border-radius:11px;font-size:14px}
.modal-hint{font-size:12px;color:var(--text-2);margin:-8px 0 16px;line-height:1.5}
.modal-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border:none;background:var(--surface-2);color:var(--text-2);border-radius:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;z-index:2;transition:all .15s var(--ease)}
.modal-close:active{transform:scale(.92)}
.modal-close:hover{background:var(--surface-3);color:var(--text)}
.form-group{margin-bottom:13px}
.form-group label{display:block;font-size:12.5px;font-weight:700;color:var(--text-2);margin-bottom:6px}
.form-group input,.form-group textarea,.form-group select{
  width:100%;padding:12px 14px;border:1.5px solid var(--line-strong);border-radius:var(--r-sm);
  background:var(--surface-2);color:var(--text);font-size:16px;font-family:inherit;transition:all .2s var(--ease);outline:none;
}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft);background:var(--surface)}
.form-group textarea{resize:vertical;min-height:74px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.form-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
.form-actions .btn{min-width:84px;justify-content:center}
/* 展开式选项卡选择器（银行 / 归属人） */
.sel-field{position:relative}
.sel-trigger{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 13px;border:1.5px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface-2);color:var(--text);font-size:15.5px;font-weight:600;cursor:pointer;transition:all .2s var(--ease);min-height:46px;text-align:left;font-family:inherit}
.sel-trigger:hover{border-color:var(--primary)}
.sel-trigger.open{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft);background:var(--surface)}
.sel-trigger.placeholder .sel-txt{color:var(--text-3);font-weight:500}
.sel-txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel-caret{font-size:11px;color:var(--text-3);transition:transform .25s var(--ease);flex:none}
.sel-trigger.open .sel-caret{transform:rotate(180deg)}
.sel-panel{margin-top:8px;border:1.5px solid var(--primary);border-radius:var(--r-sm);background:var(--surface);padding:10px;animation:selPop .2s var(--ease)}
@keyframes selPop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.sel-empty{font-size:12.5px;color:var(--text-3);padding:2px 2px 8px}
.sel-chips{display:flex;flex-wrap:wrap;gap:7px}
.sel-chip{border:1.5px solid var(--line-strong);background:var(--surface-2);color:var(--text-2);font-size:13px;font-weight:600;padding:7px 12px;border-radius:var(--r-pill);cursor:pointer;transition:all .16s var(--ease);white-space:nowrap;font-family:inherit}
.sel-chip:hover{border-color:var(--primary);color:var(--primary-strong)}
.sel-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.sel-add{display:flex;gap:7px;margin-top:9px}
.sel-add input{flex:1;min-width:0;padding:9px 11px;border:1.5px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface-2);color:var(--text);font-size:14px;outline:none;font-family:inherit}
.sel-add input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.tag-input-wrap{display:flex;flex-wrap:wrap;gap:6px;padding:8px 11px;border:1.5px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface-2);min-height:44px;align-items:center;cursor:text}
.tag-input-wrap:focus-within{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft);background:var(--surface)}
.tag-input-wrap input{flex:1;min-width:80px;border:none!important;outline:none!important;box-shadow:none!important;padding:2px 0!important;font-size:13px;background:transparent!important;color:var(--text)}

/* ============ 密码锁 ============ */
.lock-screen{position:absolute;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom));
  background:radial-gradient(130% 90% at 50% -10%, color-mix(in srgb,var(--primary-soft) 75%, transparent) 0%, transparent 55%), var(--bg-deco);}
@keyframes lockShake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.lock-box.shake{animation:lockShake .5s}
.lock-box{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);padding:40px 30px;width:100%;max-width:380px;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;text-align:center;border:1px solid var(--line)}
.lock-box .lock-icon{width:84px;height:84px;margin:0 auto 20px;background:linear-gradient(135deg,var(--primary) 0%,#5B8DEF 100%);border-radius:26px;display:flex;align-items:center;justify-content:center;font-size:36px;color:#fff;box-shadow:0 10px 28px rgba(37,99,235,.3)}
.lock-box h2{font-size:19px;margin-bottom:9px;font-weight:800}
.lock-box p{font-size:12.5px;color:var(--text-2);margin-bottom:22px;line-height:1.55}
.lock-box input{width:100%;padding:13px 16px;border:1.5px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface-2);color:var(--text);font-size:16px;text-align:center;letter-spacing:2px;margin-bottom:10px;outline:none;transition:all .2s var(--ease)}
.lock-box input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft);background:var(--surface)}
.lock-error{color:var(--danger);font-size:12px;margin-bottom:8px;min-height:18px;font-weight:600}
/* 9宫格数字密码 */
.pin-dots{display:flex;justify-content:center;gap:13px;margin-bottom:24px;min-height:14px}
.pin-dot{width:12px;height:12px;border-radius:50%;background:var(--line-strong);transition:all .18s var(--ease)}
.pin-dot.filled{background:var(--primary);transform:scale(1.15);animation:pinPop .22s var(--ease)}
.pin-dot.error{background:var(--danger);transform:scale(1.15)}
@keyframes pinPop{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1.15)}}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;max-width:258px;margin:0 auto}
.pin-key{aspect-ratio:1/1;border:1px solid var(--line);background:var(--surface-2);border-radius:18px;font-size:25px;font-weight:600;color:var(--text);box-shadow:var(--shadow-sm);transition:transform .1s var(--ease),background .1s;user-select:none;cursor:pointer}
.pin-key:active{transform:scale(.9);background:var(--primary-soft);border-color:var(--primary)}
.pin-key-empty{background:transparent;border:none;box-shadow:none;pointer-events:none}
.pin-key-del{color:var(--text-2);font-size:22px}
.lock-legacy-link{cursor:pointer}
.lock-legacy-link:hover{color:var(--primary)}

/* ============ 搜索 ============ */
.search-input-wrap{position:relative;margin-bottom:18px}
.search-input-wrap input{width:100%;padding:13px 16px 13px 46px;border:1.5px solid var(--line-strong);border-radius:var(--r);background:var(--surface);color:var(--text);font-size:14.5px;outline:none;transition:all .2s var(--ease);box-shadow:var(--shadow-xs)}
.search-input-wrap input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft),var(--shadow-sm)}
.search-input-wrap .search-icon{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:15px}
.search-result-group{margin-bottom:22px}
.search-result-group h4{font-size:12px;color:var(--primary-strong);letter-spacing:.5px;margin-bottom:11px;font-weight:800;display:flex;align-items:center;gap:7px}
.search-result-group h4::after{content:"";flex:1;height:1px;background:var(--line-strong)}
.search-result-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 16px;margin-bottom:9px;cursor:pointer;transition:all .2s var(--ease);box-shadow:var(--shadow-xs)}
.search-result-card:hover{background:var(--surface-2);transform:translateX(4px);box-shadow:var(--shadow-sm)}
.search-result-card .result-title{font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:7px}
.search-result-card .result-snippet{font-size:11.5px;color:var(--text-2);margin-top:5px;line-height:1.5}
.search-empty,.empty-state{text-align:center;padding:60px 20px;color:var(--text-3)}
.search-empty i,.empty-state i{font-size:50px;margin-bottom:14px;display:block;color:var(--primary);opacity:.4}
.search-empty p,.empty-state p{font-size:13px}

/* ============ Toast ============ */
.toast-container{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;width:max-content;max-width:90%}
.toast{background:var(--text);color:var(--bg);padding:11px 20px;border-radius:var(--r-pill);font-size:13px;box-shadow:var(--shadow-lg);animation:toastIn .3s var(--ease);display:flex;align-items:center;gap:7px;font-weight:600}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
.toast.success{background:var(--success-strong);color:#fff}
.toast.error{background:var(--danger-strong);color:#fff}

/* ============ 确认框 ============ */
.confirm-overlay{position:fixed;inset:0;background:rgba(30,32,55,.42);z-index:250;display:flex;align-items:center;justify-content:center;padding:20px;overscroll-behavior:contain}
.confirm-box{background:var(--surface);border-radius:var(--r);padding:28px 24px;width:100%;max-width:340px;text-align:center;box-shadow:var(--shadow-lg);border:1px solid var(--line)}
.confirm-box .confirm-icon{width:60px;height:60px;margin:0 auto 14px;background:var(--warning-soft);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--warning-strong)}
.confirm-box h4{font-size:15.5px;margin-bottom:8px;font-weight:800}
.confirm-box p{font-size:12.5px;color:var(--text-2);margin-bottom:18px}
.confirm-box .btn{border-radius:var(--r-pill);min-width:84px;justify-content:center}

/* ============ 设置 ============ */
.settings-grid{display:flex;flex-direction:column;gap:9px}
.set-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;box-shadow:var(--shadow-xs)}
.set-head{font-size:14px;font-weight:700;display:flex;align-items:center;gap:9px;color:var(--text);min-width:0}
.set-head i{color:var(--primary-strong);width:16px;text-align:center;flex:none}
.set-btns{display:flex;gap:8px;flex:none}
.set-item-danger{border-color:color-mix(in srgb,var(--danger) 38%,var(--line))}
.set-item-danger .set-head i{color:var(--danger-strong)}
.gs-results{max-height:54vh;overflow:auto;display:flex;flex-direction:column;gap:7px;margin-top:4px}
.gs-empty{text-align:center;color:var(--text-3);font-size:13px;padding:26px 0}
.gs-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
.gs-item:active{transform:scale(.99)}
.gs-item:hover{border-color:var(--primary);background:var(--primary-soft)}
.gs-ico{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--surface-3);font-size:13px;flex:none}
.gs-txt{flex:1;min-width:0}
.gs-title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs-sub{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.gs-go{color:var(--text-3);font-size:12px;flex:none}

/* ============ 顶部导航 + 浮动按钮 ============ */
.nav-item{
  flex:1;background:none;border:none;cursor:pointer;color:var(--text-3);
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:14px;
  font-size:11px;font-weight:700;transition:all .2s var(--ease);position:relative;min-width:0;
}
.nav-item i{font-size:18px;transition:transform .25s var(--ease)}
.nav-item.active{color:var(--primary-strong);background:var(--primary-soft)}
.nav-item.active i{transform:translateY(-1px) scale(1.05)}

.fab{
  position:absolute;right:16px;
  bottom:calc(74px + env(safe-area-inset-bottom));
  width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;z-index:118;
  background:linear-gradient(135deg,#2563EB 0%,#5B8DEF 100%);color:#fff;font-size:24px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 26px rgba(37,99,235,.5);
  transition:transform .25s var(--ease),opacity .25s var(--ease);
}
.fab:active{transform:scale(.92)}
@media(hover:hover){.fab:hover{transform:translateY(-2px) rotate(90deg)}}
.fab.hidden{opacity:0;pointer-events:none;transform:scale(.5)}

/* 底部弹出菜单（新建） */
.sheet-overlay{position:fixed;inset:0;background:rgba(30,32,55,.4);z-index:260;display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .3s var(--ease);overscroll-behavior:contain}
.sheet-overlay.open{opacity:1;pointer-events:auto}
.sheet{background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;width:100%;max-width:460px;padding:10px 18px max(20px,env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .35s var(--ease);box-shadow:var(--shadow-lg)}
.sheet-overlay.open .sheet{transform:translateY(0)}
.sheet-grip{width:40px;height:4px;border-radius:2px;background:var(--line-strong);margin:6px auto 14px}
.sheet-title{font-size:14px;font-weight:800;color:var(--text-2);margin-bottom:12px;padding-left:4px}
.sheet-item{width:100%;display:flex;align-items:center;gap:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:all .2s var(--ease);text-align:left}
.sheet-item:hover{background:var(--primary-soft);border-color:var(--primary)}
.sheet-item .si{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex-shrink:0}
.sheet-item .si-memo{background:linear-gradient(135deg,#2563EB,#5B8DEF)}
.sheet-item .si-bank{background:linear-gradient(135deg,#54c2a0,#7fd9bd)}
.sheet-item .si-stock{background:linear-gradient(135deg,#f0b35a,#f6c574)}
.sheet-item .si-text{display:flex;flex-direction:column;line-height:1.3}
.sheet-item .si-text span{font-size:14.5px;font-weight:800}
.sheet-item .si-text em{font-size:11.5px;color:var(--text-3);font-style:normal;font-weight:500}
.sheet-cancel{width:100%;padding:14px;border:none;background:var(--surface-3);color:var(--text-2);border-radius:var(--r);font-size:14px;font-weight:700;cursor:pointer;margin-top:4px}

/* ===== 待办模块 ===== */
.todo-stats{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.todo-stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 11px;flex:1;min-width:68px;text-align:center;box-shadow:var(--shadow-sm)}
.todo-stat b{display:block;font-size:18px;font-weight:800;color:var(--primary-strong)}
.todo-stat span{font-size:10.5px;color:var(--text-3)}
.todo-stat.overdue b{color:var(--danger)}
.todo-stat.done b{color:#43a06a}
.todo-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.todo-tab{border:1px solid var(--line);background:var(--surface);color:var(--text-3);padding:6px 13px;border-radius:999px;cursor:pointer;font-size:12px;font-weight:700;transition:all .15s}
.todo-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.todo-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 13px;display:flex;align-items:flex-start;gap:10px;box-shadow:var(--shadow-sm);transition:opacity .25s var(--ease),border-color .15s,transform .12s var(--ease);cursor:pointer;margin-bottom:9px;position:relative;overflow:hidden}
.todo-item:hover{border-color:var(--primary)}
.todo-item.overdue{border-color:var(--danger);background:rgba(239,107,107,.06)}
.todo-item.done{opacity:.5}
.todo-item:active{transform:scale(.98)}
.todo-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line-strong);transition:background .2s}
.todo-item.s-over::before,.todo-item.s-over.overdue::before{background:var(--danger)}

.todo-item.s-soon::before{background:var(--line-strong)}

.prio-btn[data-p="mid"].active{background:var(--warning);border-color:var(--warning)}

.switch-row{display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--text-1)}
.switch{position:relative;display:inline-block;width:44px;height:25px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch .slider{position:absolute;cursor:pointer;inset:0;background:var(--line-strong);border-radius:999px;transition:background .2s var(--ease)}
.switch .slider::before{content:'';position:absolute;height:19px;width:19px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .2s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked+.slider{background:var(--primary)}
.switch input:checked+.slider::before{transform:translateX(19px)}
.todo-badge.count{background:rgba(99,102,241,.12);color:#6366f1}

.confetti{position:fixed;top:40%;left:50%;width:9px;height:14px;border-radius:2px;pointer-events:none;z-index:9000;animation:confettiFall .9s ease-out forwards}
@keyframes confettiFall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--cx,0),var(--cy,120px)) rotate(var(--cr,360deg))}}
.todo-check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line-strong);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700;transition:all .15s;background:var(--surface-2);margin-top:1px}

<body data-theme="light">

<div class="phone">
<!-- 密码锁 -->

<!-- 悬浮新建：当前模块直接新增（逻辑在脚本中按 currentTab 分发） -->

<script>
"use strict";
const DB_NAME='memo_vault_db', STORE='vault', VAULT_KEY='vault';
let cryptoKey=null, vaultSalt=null, vaultPinLen=0;
const DEFAULT_CHECKIN_DEFS=[{id:'eye',title:'眼部放松',icon:'💧',url:'https://v.douyin.com/0A3nxFCY0EQ/'},{id:'shake',title:'摇垮跟练',icon:'💃',url:'https://v.douyin.com/8DooryoLjrs/'},{id:'bdj',title:'八段锦跟练',icon:'🧘',url:'https://v.douyin.com/8vx_0r61WVE/'},{id:'gufa',title:'古法健身',icon:'🌿',url:'https://v.douyin.com/x4wps8yl_so/'}];
function normalizeState(d){ d=d||{}; const banks=Array.isArray(d.banks)?d.banks:[]; let bankHistory=Array.isArray(d.bankHistory)?d.bankHistory:[]; if(!bankHistory.length){ const s=new Set(banks.map(b=>b.bankName).filter(Boolean)); bankHistory=[...s]; } let ownerHistory=Array.isArray(d.ownerHistory)?d.ownerHistory:[]; if(!ownerHistory.length){ const s2=new Set(banks.map(b=>b.ownerName).filter(Boolean)); ownerHistory=[...s2]; } return { memos:Array.isArray(d.memos)?d.memos:[], banks, stocks:Array.isArray(d.stocks)?d.stocks:[], todos:Array.isArray(d.todos)?d.todos:[], trash:Array.isArray(d.trash)?d.trash:[], bankHistory, ownerHistory, checkinDefs:Array.isArray(d.checkinDefs)?d.checkinDefs:DEFAULT_CHECKIN_DEFS, checkinState:(d.checkinState&&typeof d.checkinState==='object')?d.checkinState:{date:'',done:{}} }; }
let state=normalizeState();
let currentTab='todo', bankFilter='all', ownerFilter='all', stockFilterTags=[], memoFilterTags=[], searchQuery='';
let revealedCVV=new Set();

const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const nowISO=()=>new Date().toISOString();
function fmtTime(iso){ const d=new Date(iso),p=n=>(n<10?'0':'')+n; return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg,type=''){
  const c=$('toast-container')||(()=>{const e=document.createElement('div');e.id='toast-container';e.className='toast-container';document.body.appendChild(e);return e;})();
  const t=document.createElement('div');t.className='toast '+type;
  t.innerHTML=(type==='success'?'<i class="fa-solid fa-circle-check"></i>':type==='error'?'<i class="fa-solid fa-circle-exclamation"></i>':'<i class="fa-solid fa-circle-info"></i>')+msg;
  c.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transform='translateY(-12px)';t.style.transition='all .3s';setTimeout(()=>t.remove(),300);},2400);
}
function confirmDialog(title,desc){
  return new Promise(res=>{
    const ov=document.createElement('div');ov.className='confirm-overlay';
    ov.innerHTML=`<div class="confirm-box"><div class="confirm-icon"><i class="fa-solid fa-triangle-exclamation"></i></div><h4>${title}</h4><p>${desc}</p><div style="display:flex;gap:9px;justify-content:center"><button class="btn btn-outline" id="cf-no">取消</button><button class="btn btn-danger" id="cf-yes">确定</button></div></div>`;
    document.body.appendChild(ov);
    $('cf-yes').onclick=()=>{ov.remove();res(true);};
    $('cf-no').onclick=()=>{ov.remove();res(false);};
  });
}

/* 加密层 */
function b64enc(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function b64dec(str){ return Uint8Array.from(atob(str),c=>c.charCodeAt(0)); }
async function deriveKey(pw,salt){ const enc=new TextEncoder(); const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']); return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']); }
async function encryptObj(obj,key){ const iv=crypto.getRandomValues(new Uint8Array(12)); const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj))); return {iv:b64enc(iv),ct:b64enc(ct)}; }
async function decryptObj(rec,key){ const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64dec(rec.iv)},key,b64dec(rec.ct)); return JSON.parse(new TextDecoder().decode(pt)); }
function openDB(){ return new Promise((res,rej)=>{ const r=indexedDB.open(DB_NAME,1); r.onupgradeneeded=()=>r.result.createObjectStore(STORE); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(key){ const db=await openDB(); return new Promise((res,rej)=>{ const rq=db.transaction(STORE,'readonly').objectStore(STORE).get(key); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); }
async function idbPut(key,val){ const db=await openDB(); return new Promise((res,rej)=>{ const t=db.transaction(STORE,'readwrite'); t.objectStore(STORE).put(val,key); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }
async function idbDel(key){ const db=await openDB(); return new Promise((res,rej)=>{ const t=db.transaction(STORE,'readwrite'); t.objectStore(STORE).delete(key); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }
async function save(){ if(!cryptoKey)return; const rec=await encryptObj(state,cryptoKey); await idbPut(VAULT_KEY,{salt:b64enc(vaultSalt),pinLen:vaultPinLen,...rec}); autoBackup(); }
function autoBackup(){ try{ const strip=o=>{ const c=JSON.parse(JSON.stringify(o)); (c.memos||[]).forEach(m=>{delete m.images;}); (c.stocks||[]).forEach(s=>{delete s.images;}); return c; }; const snap={savedAt:nowISO(),data:strip(state)}; localStorage.setItem('memo_auto_backup',JSON.stringify(snap)); }catch(e){} }
function restoreAutoBackup(){ const raw=localStorage.getItem('memo_auto_backup'); if(!raw){toast('没有可用的自动备份','error');return;} let snap; try{snap=JSON.parse(raw);}catch(e){toast('备份文件损坏','error');return;} confirmDialog('恢复自动备份','将用本地自动备份（'+fmtTime(snap.savedAt)+'，仅文字、不含图片）覆盖当前数据。').then(ok=>{ if(!ok)return; const d=snap.data||{}; if(Array.isArray(d.memos))state.memos=d.memos; if(Array.isArray(d.banks))state.banks=d.banks; if(Array.isArray(d.stocks))state.stocks=d.stocks; if(Array.isArray(d.todos))state.todos=d.todos; save();renderAll();closeModal();toast('已恢复自动备份','success'); }); }

/* 密码锁 */
const PIN_MIN=4, PIN_MAX=12;
let pinBuffer='', pinStep=0, pinFirst='';
async function initLock(){
  const exists=await idbGet(VAULT_KEY);
  const screen=$('lockScreen');
  if(!exists){
    $('lockTitle').textContent='设置数字密码'; $('lockDesc').innerHTML='设置一个 4–12 位数字密码<br>用于加密你的数据，无法找回请牢记';
    $('lockBtn').dataset.mode='setup'; $('lockBtn').textContent='继续';
    $('lockLegacyLink').style.display='none'; $('lockLegacy').style.display='none'; $('pinPad').style.display='grid';
    renderPinDots(PIN_MIN);
  }else{
    const rec=exists; vaultPinLen=rec.pinLen||0;
    $('lockTitle').textContent='输入数字密码'; $('lockDesc').textContent='请输入你的数字密码以解锁';
    $('lockBtn').dataset.mode='unlock'; $('lockBtn').textContent='解锁';
    if(!vaultPinLen){ $('lockLegacyLink').style.display='block'; } else { $('lockLegacyLink').style.display='none'; $('lockLegacy').style.display='none'; }
    $('pinPad').style.display='grid';
    renderPinDots(vaultPinLen||PIN_MIN);
  }
  screen.style.display='flex';
}
function lockNow(){ cryptoKey=null; const ls=$('lockStatus'); if(ls){ls.className='lock-pill locked'; ls.innerHTML='<i class="fa-solid fa-lock"></i> 已锁定'; ls.style.display='';} initLock(); }
$('lockBtn').onclick=async()=>{
  const mode=$('lockBtn').dataset.mode; $('lockError').textContent='';
  if(mode==='setup'){
    if(pinStep===0){
      if(pinBuffer.length<PIN_MIN){lockErrorShake(`至少 ${PIN_MIN} 位`);return;}
      pinFirst=pinBuffer; pinStep=1; pinBuffer=''; onPinInput(); $('lockDesc').textContent='再输入一次以确认';
    }else{
      if(pinBuffer!==pinFirst){ pinBuffer=''; pinFirst=''; pinStep=0; onPinInput(); $('lockDesc').textContent='设置一个 4–12 位数字密码'; lockErrorShake('两次不一致，重来'); return;}
      const pw=pinBuffer; const salt=crypto.getRandomValues(new Uint8Array(16)); vaultSalt=salt; cryptoKey=await deriveKey(pw,salt);
      state=normalizeState();
      const rec=await encryptObj(state,cryptoKey); await idbPut(VAULT_KEY,{salt:b64enc(salt),pinLen:pw.length,...rec});
      vaultPinLen=pw.length; finishUnlock(); toast('数字密码设置成功','success');
    }
  }else{
    if($('lockLegacy').style.display!=='none'){ const pw=$('lockLegacy').value; if(!pw){$('lockError').textContent='请输入原密码';return;} await doUnlock(pw); return; }
    if(!pinBuffer){$('lockError').textContent='请输入密码';return;}
    await doUnlock(pinBuffer);
  }
};
async function doUnlock(pw){ const rec=await idbGet(VAULT_KEY), salt=b64dec(rec.salt); vaultSalt=salt; const key=await deriveKey(pw,salt); let data; try{data=await decryptObj(rec,key);}catch(e){ lockErrorShake('密码错误，请重试'); pinBuffer=''; onPinInput(); return; } cryptoKey=key; state=normalizeState(data); finishUnlock(); }
function renderPinDots(expected){ const d=$('pinDots'); if(!d)return; const n=Math.max(expected,pinBuffer.length); while(d.children.length<n){ const s=document.createElement('span'); s.className='pin-dot'; d.appendChild(s); } while(d.children.length>n){ d.removeChild(d.lastChild); } const err=d.dataset.err==='1'; for(let i=0;i<n;i++){ d.children[i].className='pin-dot'+(i<pinBuffer.length?(err?' error':' filled'):''); } }
function lockErrorShake(msg){ const e=$('lockError'); if(e)e.textContent=msg; const box=$('lockBox'); if(box){box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); setTimeout(()=>box.classList.remove('shake'),520);} const d=$('pinDots'); if(d){d.dataset.err='1'; renderPinDots(pinBuffer.length);} }
function pinKeyPressed(k){ if(k==='del'){ pinBuffer=pinBuffer.slice(0,-1); } else { if(pinBuffer.length>=PIN_MAX)return; pinBuffer+=k; } onPinInput(); }

/* 标签输入（支持中英文逗号/回车、已有标签下拉建议、中文输入法、失焦自动提交） */
function attachTagInput(wrapId,inputId,tagsArr,suggest){
  const wrap=$(wrapId),input=$(inputId);
  if(suggest&&suggest.length){
    let dl=document.getElementById(inputId+'-dl');
    if(!dl){dl=document.createElement('datalist');dl.id=inputId+'-dl';document.body.appendChild(dl);}
    dl.innerHTML=suggest.map(t=>`<option value="${esc(t)}">`).join('');
    input.setAttribute('list',inputId+'-dl');
  }
  function render(){
    wrap.querySelectorAll('.tag').forEach(t=>t.remove());
    tagsArr.forEach((tg,i)=>{ const el=document.createElement('span'); el.className='tag'; el.innerHTML=esc(tg)+'<span class="tag-remove" data-i="'+i+'">×</span>'; el.querySelector('.tag-remove').onclick=ev=>{ev.stopPropagation();tagsArr.splice(i,1);render();}; wrap.insertBefore(el,input); });
  }
  function commit(){
    const parts=input.value.split(/[，,]/).map(s=>s.trim()).filter(Boolean);
    parts.forEach(v=>{ if(v&&!tagsArr.includes(v))tagsArr.push(v); });
    input.value=''; render();
  }
  input.addEventListener('keydown',e=>{
    if(e.isComposing)return; // 中文输入法组合中，不拦截，避免吞掉候选词
    const k=e.key;
    if(k==='Enter'||k===','){ e.preventDefault(); commit(); }
    else if(k==='Backspace'&&!input.value&&tagsArr.length){ e.preventDefault(); tagsArr.pop(); render(); }
  });
  input.addEventListener('input',()=>{ if(/[，,]$/.test(input.value))commit(); }); // 中文逗号即时成标签
  input.addEventListener('compositionend',()=>{ if(input.value.trim())commit(); }); // 拼音选词后自动成标签
  input.addEventListener('blur',()=>{ if(input.value.trim())commit(); }); // 直接点保存也不丢未提交文本
  render();
}

let todoFilter='all', lastPriority='none';
function todoStatusClass(t,now){
  if(t.done)return 's-done';
  if(t.countdown){ if(t.targetDate&&t.targetDate<now)return 's-over'; return 's-soon'; }
  if(isOverdue(t,now))return 's-over';
  if(!t.noTime&&t.nextRemindAt){ const d=new Date(t.nextRemindAt),n=new Date(now); if(d.toDateString()===n.toDateString())return 's-today'; }
  return 's-soon';
}
function countdownStr(ts,now){ if(!ts)return ''; const days=Math.ceil((ts-now)/86400000); if(days>0)return `还有 ${days} 天`; if(days===0)return '就是今天'; return `已过 ${Math.abs(days)} 天`; }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function ensureCheckin(){
  const cs=state.checkinState||{date:'',done:{}};
  if(!cs.date||cs.date!==todayStr()){ cs.date=todayStr(); cs.done={}; }
  (state.checkinDefs||[]).forEach(d=>{ if(typeof cs.done[d.id]==='undefined') cs.done[d.id]=false; });
  state.checkinState=cs;
}
function computeNext(base,repeat,customDays,now){
  let t=new Date(base),guard=0;
  while(t.getTime()<=now&&guard<5000){
    if(repeat==='daily')t.setDate(t.getDate()+1);
    else if(repeat==='weekly')t.setDate(t.getDate()+7);
    else if(repeat==='monthly')t.setMonth(t.getMonth()+1);
    else if(repeat==='custom')t.setDate(t.getDate()+(+customDays||1));
    else { t=new Date(now+1000); break; } guard++;
  }
  return t.getTime();
}
function isOverdue(t,now){ if(t.done||t.noTime||t.nextRemindAt==null)return false; return t.nextRemindAt<now; }
function todoFmt(ts){ const d=new Date(ts),p=n=>String(n).padStart(2,'0'),now=new Date();
  const sameDay=d.toDateString()===now.toDateString(),tomorrow=new Date(now);tomorrow.setDate(now.getDate()+1);
  const isTom=d.toDateString()===tomorrow.toDateString();
  let prefix=sameDay?'今天':isTom?'明天':`${d.getMonth()+1}月${d.getDate()}日`;
  return `${prefix} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function repLabel(t){ if(t.repeat==='none')return''; if(t.repeat==='daily')return'每天'; if(t.repeat==='weekly')return'每周'; if(t.repeat==='monthly')return'每月'; if(t.repeat==='custom')return`每${t.customDays}天`; return''; }
function leftTime(t,now){ const diff=t.nextRemindAt-now; if(diff<=0)return''; const m=Math.floor(diff/60000); if(m<60)return m+'分钟'; const h=Math.floor(m/60); if(h<24)return h+'小时'+(m%60)+'分'; const d=Math.floor(h/24); return d+'天'+(h%24)+'小时'; }

function saveTodo(id){
  state.todos=state.todos||[];
  const title=$('td-title').value.trim(),timeVal=$('td-time').value,repeat=$('td-repeat').value,customDays=$('td-custom').value;
  const prEl=document.querySelector('#td-prio .prio-btn.active'); const priority=prEl?prEl.dataset.p:'none';
  const countdown=$('td-count')?$('td-count').checked:false;
  const dateVal=$('td-date')?$('td-date').value:'';
  if(!title){toast('事项不能为空','error');return;}
  const noTime=!timeVal,base=timeVal?new Date(timeVal).getTime():null,now=Date.now();
  let next=null;if(!countdown){ if(!noTime&&repeat!=='none')next=computeNext(base,repeat,customDays,now);else if(!noTime)next=base; }
  const targetDate=countdown&&dateVal?new Date(dateVal+'T00:00:00').getTime():null;
  if(id){const t=state.todos.find(x=>x.id===id);Object.assign(t,{title,repeat,customDays:+customDays,noTime,nextRemindAt:next,updatedAt:nowISO(),priority,countdown,targetDate});}
  else{state.todos.unshift({id:uid(),title,repeat,customDays:+customDays,noTime,createdAt:nowISO(),nextRemindAt:next,done:false,completedAt:null,priority,countdown,targetDate});}
  lastPriority=priority;
  save().then(()=>{ renderAll();closeModal();toast('已保存','success'); }).catch(err=>{ toast('保存失败，请重试','error'); console.error(err); });
}

function toggleTodo(id){ const t=state.todos.find(x=>x.id===id);if(!t)return;
  if(t.repeat==='none'||t.noTime){ t.done=!t.done;t.completedAt=t.done?Date.now():null; }
  else{ if(!t.done){t.done=true;t.completedAt=Date.now();t.nextRemindAt=computeNext(t.nextRemindAt,t.repeat,t.customDays,Date.now());} else{t.done=false;t.completedAt=null;} }
  save();renderTodos();}

function confettiBurst(){ const colors=['#2563EB','#54c2a0','#f0b35a','#f1789c','#8a6fe0','#5B8DEF']; const cx=innerWidth/2, cy=innerHeight*0.72; for(let i=0;i<20;i++){ const p=document.createElement('div'); p.className='confetti'; const s=6+Math.random()*6; p.style.left=(cx+(Math.random()*140-70))+'px'; p.style.top=cy+'px'; p.style.width=s+'px'; p.style.height=s+'px'; p.style.background=colors[i%colors.length]; p.style.transform=`rotate(${Math.random()*360}deg)`; p.style.animationDelay=(Math.random()*0.12)+'s'; document.body.appendChild(p); setTimeout(()=>p.remove(),1000); } }

/* 渲染 */
function renderTodos(){
  ensureCheckin();const now=Date.now();
  state.todos.forEach(t=>{if(t.repeat!=='none'&&!t.noTime&&t.done&&now>=t.nextRemindAt){t.done=false;t.completedAt=null;}});
  let arr=state.todos.slice();
  if(todoFilter==='pend')arr=arr.filter(t=>!t.done);
  else if(todoFilter==='over')arr=arr.filter(t=>isOverdue(t,now));
  else if(todoFilter==='done')arr=arr.filter(t=>t.done);
  else if(todoFilter==='count')arr=arr.filter(t=>t.countdown);
  if(searchQuery){const q=searchQuery;arr=arr.filter(t=>t.title.toLowerCase().includes(q));}
  arr.sort((a,b)=>(a.done?1:0)-(b.done?1:0)); // 手动拖拽顺序；已完成沉底
  const list=$('todoList'),empty=$('todoEmpty');
  empty.style.display=(!arr.length)?'block':'none';
  if(!arr.length){list.innerHTML='';return;}
  list.innerHTML=arr.map(t=>{
    const over=isOverdue(t,now), cd=!!t.countdown, st=todoStatusClass(t,now), prio=t.priority||'none';
    const prioBadge=prio==='none'?'':`<span class="todo-badge prio ${prio}">${prio==='high'?'高':prio==='mid'?'中':'低'}</span>`;
    const cdStr=cd?countdownStr(t.targetDate,now):'';
    const timeBadge=cd?'<span class="todo-badge left cd-badge">⏳ '+cdStr+'</span>':(t.noTime?'<span class="todo-badge left">🕊 不限时</span>':`<span class="todo-badge left">⏰ ${todoFmt(t.nextRemindAt)}</span>`);
    const leftStr=t.done?(cd?'已发生':(t.noTime?'已完成':new Date(t.completedAt).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})+' 完成')):(over?'已超时':(cd?cdStr:leftTime(t,now)));
    return `<div class="todo-item${over?' overdue':''}${t.done?' done':''}${st?' '+st:''}" draggable="true" data-id="${t.id}">
      <div class="todo-check" onclick="event.stopPropagation();toggleTodo('${t.id}')">${t.done?'✓':''}</div>
      <div class="todo-body" onclick="openTodoDetail('${t.id}')">
        <div class="todo-title">${esc(t.title)}</div>
        <div class="todo-meta">${over&&!cd?'<span class="todo-badge over">⚠ 超时</span>':''}${prioBadge}${timeBadge}${t.repeat!=='none'&&!t.noTime&&!cd?`<span class="todo-badge rep">🔁 ${repLabel(t)}</span>`:''}<span class="todo-badge left">${leftStr}</span></div>
      </div>
      <button class="todo-del" onclick="event.stopPropagation();removeTodo('${t.id}')" title="删除">×</button>
    </div>`;
  }).join('');
  // 更新 tab 标签
  document.querySelectorAll('#todoTabs .todo-tab').forEach(tab=>{
    const f=tab.dataset.f;
    tab.textContent=f==='all'?'全部':f==='pend'?'待办':f==='over'?'超时':f==='done'?'已完成':'倒数';
  });
}

function saveBank(id){

    const norm=cardNumber.replace(/\s/g,'');
    const dup=state.banks.find(b=>b.cardNumber&&b.cardNumber.replace(/\s/g,'')===norm&&b.id!==id);
    if(dup){toast('卡号已存在：'+esc(dup.bankName||'')+' · '+esc(dup.ownerName||'')+'，请勿重复录入','error');return;}
  }
  /* 防重复点击 */
  const btn=document.querySelector('#modalOverlay .btn-primary'); if(btn){btn.disabled=true;btn.textContent='保存中…';}
  const repaid=id?(state.banks.find(x=>x.id===id).repaid||[]).slice():[];
  if(id){ const b=state.banks.find(x=>x.id===id); Object.assign(b,{bankName,ownerName,cardNumber,validThru,cvc,billingDay,cardType,remark,repaid,updatedAt:nowISO()}); }
  else{ state.banks.unshift({id:uid(),bankName,ownerName,cardNumber,validThru,cvc,billingDay,cardType,remark,repaid,createdAt:nowISO(),updatedAt:nowISO()}); }
  state.bankHistory=state.bankHistory||[]; if(bankName){ const hi=state.bankHistory.indexOf(bankName); if(hi>=0)state.bankHistory.splice(hi,1); state.bankHistory.unshift(bankName); if(state.bankHistory.length>50)state.bankHistory.length=50; }
  if(ownerName){ state.ownerHistory=state.ownerHistory||[]; const oi=state.ownerHistory.indexOf(ownerName); if(oi>=0)state.ownerHistory.splice(oi,1); state.ownerHistory.unshift(ownerName); if(state.ownerHistory.length>50)state.ownerHistory.length=50; }
  /* 异步保存，完成后关闭弹窗 */
  save().then(()=>{ renderAll();closeModal();toast('已保存','success'); }).catch(err=>{ toast('保存失败，请重试','error'); console.error(err); if(btn){btn.disabled=false;btn.textContent='保存';} });

function ensureTesseract(cb){
  if(window.Tesseract){cb();return;}
  toast('正在加载识图组件…','');
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
  s.onload=()=>{ toast('识图组件已就绪','success'); cb(); };
  s.onerror=()=>toast('识图组件加载失败，请检查网络','error');
  document.head.appendChild(s);
}
function startBankOCR(){ ensureTesseract(()=>{ const f=$('bankOcrFile'); if(f)f.click(); }); }
function onBankOCRFile(e){
  const file=e.target.files&&e.target.files[0]; e.target.value=''; if(!file)return;
  if(!window.Tesseract){ toast('识图组件未就绪，请稍候重试','error'); return; }
  showOcrLoading(true);
  const reader=new FileReader();
  reader.onload=()=>{ Tesseract.recognize(reader.result,'eng').then(({data})=>{ showOcrLoading(false); fillBankFromOCR(data.text||''); }).catch(err=>{ showOcrLoading(false); toast('识图失败：'+(err&&err.message||err),'error'); }); };
  reader.onerror=()=>{ showOcrLoading(false); toast('读取图片失败','error'); };
  reader.readAsDataURL(file);
}
function fillBankFromOCR(text){
  if(!text||!text.trim()){ toast('未识别到文字','error'); return; }
  const nums=(text.match(/\d+/g)||[]);
  let cardNo=''; nums.forEach(n=>{ if(n.length>=13&&n.length>cardNo.length)cardNo=n; });
  let work=text; if(cardNo) work=work.split(cardNo).join(' ');
  let expiry=''; const em=work.match(/\b(\d{2})[\s/](\d{2})\b/); if(em&&+em[1]>=1&&+em[1]<=12)expiry=em[1]+'/'+em[2];
  if(!expiry){ const f=(work.match(/\b\d{4}\b/g)||[]).find(s=>{const m=+s.slice(0,2);return m>=1&&m<=12;}); if(f)expiry=f.slice(0,2)+'/'+f.slice(2); }
  let cvc=''; const c3=(work.match(/\b\d{3}\b/g)||[]); if(c3.length)cvc=c3[0];
  if(cardNo){const el=$('b-number');if(el)el.value=cardNo;}
  if(expiry){const el=$('b-valid');if(el)el.value=expiry;}
  if(cvc){const el=$('b-cvc');if(el)el.value=cvc;}
  toast((cardNo||expiry||cvc)?'已自动识别填入，请核对':'未识别到卡号/日期/安全码','success');
}

function toggleRepaid(id){
  const b=state.banks.find(x=>x.id===id); if(!b)return;
  b.repaid=b.repaid||[];
  const ym=ymKey();
  const i=b.repaid.indexOf(ym);

  save();renderBanks();
  toast(i>=0?'已取消「已还」':'已标记为「已还」，当月不再提醒','success');

function expiryInfo(validThru){
  if(!validThru||!/^\d{2}\/\d{2}$/.test(validThru))return null;
  const [mm,yy]=validThru.split('/').map(Number),end=new Date(2000+yy,mm,0,23,59,59),now=new Date();
  if(now>end)return{state:'expired',text:'已过期',cls:'expired'};
  const days=Math.ceil((end-now)/86400000); if(days<=60)return{state:'expiring',text:`${days}天后到期`,cls:'expiring'}; return null;
}
const BILL_REMIND_DAYS=3, BILL_WINDOW_DAYS=7; // 卡片高亮阈值 / 顶部聚合窗口（天）
function ymKey(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function isRepaid(b){ return !!(b&&Array.isArray(b.repaid)&&b.repaid.includes(ymKey())); }
function billingDays(b){  if(!b.billingDay)return null;
  const now=new Date();
  let next=new Date(now.getFullYear(),now.getMonth(),b.billingDay);
  if(next<now)next=new Date(now.getFullYear(),now.getMonth()+1,b.billingDay);
  const d=Math.ceil((next-now)/86400000);
  return d<0?null:d;
}
function billingReminder(b){
  if(isRepaid(b))return null;
  const d=billingDays(b);
  if(d===null||d>BILL_WINDOW_DAYS)return null;
  const level=d<=BILL_REMIND_DAYS?'urgent':'soon';
  const text=d===0?'今天账单日':d===1?'明天账单日':d+'天后账单日';
  return {days:d,level,text};
}

function formatCard(num){ if(!num)return''; const s=String(num).replace(/\s/g,''); return s.replace(/(.{4})(?=.)/g,'$1 ').trim(); }
function copyText(text,msg){ if(text==null||text===''){toast('没有可复制的内容','error');return;} text=String(text); const done=()=>toast(msg||'已复制','success'); if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done)); } else fallbackCopy(text,done); }
function fallbackCopy(text,done){ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.top='-999px'; ta.style.opacity='0'; document.body.appendChild(ta); ta.focus(); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast('复制失败','error'); } ta.remove(); }
function toggleCVV(id){ if(revealedCVV.has(id))revealedCVV.delete(id); else revealedCVV.add(id); renderBanks(); }
function bankAccent(name){
  const dark=document.body.dataset.theme==='dark';
  const hues=[222,232,212,246,258,226,238,216]; // 柔和的蓝/靛/紫同族，避开荧光绿青
  let h=0; const s=name||''; for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;
  const hue=hues[h%hues.length];
  const sat=dark?42:46;       // 低饱和，柔和不过艳
  const light=dark?62:58;    // 明度适中
  return `hsl(${hue} ${sat}% ${light}%)`;
}

  state.todos.forEach(t=>{ if((t.title||'').toLowerCase().includes(q)||(t.content||'').toLowerCase().includes(q)){ const now=Date.now(); const st=t.done?'已完成':(isOverdue(t,now)?'已超时':(t.countdown?'倒数日':'待办')); res.push(['todo',`<i class="fa-solid fa-list-check"></i>`,'var(--primary)',t.title||'(待办)',st+' · 点击打开',`closeModal();gotoTab('todo');openTodoDetail('${t.id}')`]); } });
  state.memos.forEach(m=>{ if((m.content||'').toLowerCase().includes(q)||(m.tags||[]).some(t=>t.toLowerCase().includes(q))) res.push(['memo',`<i class="fa-solid fa-note-sticky"></i>`,'#54c2a0',firstLine(m.content)||'备忘',fmtTime(m.createdAt),`closeModal();gotoTab('memo');openMemoDetail('${m.id}')`]); });
  state.banks.forEach(b=>{ if((b.bankName||'').toLowerCase().includes(q)||(b.ownerName||'').toLowerCase().includes(q)||(b.cardNumber||'').toLowerCase().includes(q)||(b.remark||'').toLowerCase().includes(q)) res.push(['bank',`<i class="fa-solid fa-credit-card"></i>`,bankAccent(b.bankName),b.bankName||'银行卡',(b.ownerName||'')+' '+(b.cardNumber?formatCard(b.cardNumber):''),`closeModal();gotoTab('bank');openBankDetail('${b.id}')`]); });
  state.stocks.forEach(s=>{ if((s.title||'').toLowerCase().includes(q)||(s.content||'').toLowerCase().includes(q)||(s.tags||[]).some(t=>t.toLowerCase().includes(q))) res.push(['stock',`<i class="fa-solid fa-chart-line"></i>`,'#8a6fe0',s.title||'(无标题)',fmtTime(s.createdAt),`closeModal();gotoTab('stock');openStockDetail('${s.id}')`]); });
  if(!res.length){ box.innerHTML='<div class="gs-empty">没有匹配「'+esc(q)+'」的内容</div>'; return; }
  box.innerHTML=res.map(r=>gsItem(r[1],r[2],r[3],r[4],r[5])).join('');
}

/* 设置（由右上角菜单触发） */
function openSettings(){
  const t=document.body.dataset.theme;
  openModal(`<h3><i class="fa-solid fa-gear"></i> 设置</h3>
    <div class="settings-grid">
      <div class="set-item"><div class="set-head"><i class="fa-solid fa-circle-half-stroke"></i> 深浅主题（${t==='dark'?'深色':'浅色'}）</div><button class="btn btn-sm btn-outline" onclick="toggleTheme();openSettings();"><i class="fa-solid fa-${t==='dark'?'sun':'moon'}"></i> ${t==='dark'?'浅色':'深色'}</button></div>
      <div class="set-item"><div class="set-head"><i class="fa-solid fa-download"></i> 数据备份</div><button class="btn btn-sm btn-outline" onclick="exportData()"><i class="fa-solid fa-file-export"></i> 导出</button></div>
      <div class="set-item"><div class="set-head"><i class="fa-solid fa-bell"></i> 系统通知（${notifyPerm==='granted'?'已开启':notifyPerm==='denied'?'已拒绝':'未开启'}）</div><div class="set-btns"><button class="btn btn-sm btn-outline" onclick="requestNotify()">${notifyPerm==='granted'?'重新授权':'开启'}</button>${notifyPerm==='granted'?'<button class="btn btn-sm btn-outline" onclick="notify(\'综合备忘录\',\'这是一条测试通知\')">测试</button>':''}</div></div>
      <div class="set-item"><div class="set-head"><i class="fa-solid fa-clock-rotate-left"></i> 自动备份</div><button class="btn btn-sm btn-outline" onclick="restoreAutoBackup()"><i class="fa-solid fa-rotate-left"></i> 恢复</button></div>
      <div class="set-item"><div class="set-head"><i class="fa-solid fa-trash-can"></i> 回收站（${state.trash.length}）</div><button class="btn btn-sm btn-outline" onclick="openTrash()"><i class="fa-solid fa-recycle"></i> 查看</button></div>
      <div class="set-item"><div class="set-head"><i class="fa-solid fa-upload"></i> 导入数据</div><button class="btn btn-sm btn-outline" onclick="document.getElementById('importFile').click()"><i class="fa-solid fa-file-import"></i> 导入</button><input type="file" id="importFile" accept=".json" hidden onchange="importData()"></div>
      <div class="set-item"><div class="set-head"><i class="fa-solid fa-key"></i> 修改主密码</div><button class="btn btn-sm btn-outline" onclick="openPwdModal()"><i class="fa-solid fa-rotate"></i> 修改</button></div>
      <div class="set-item set-item-danger"><div class="set-head"><i class="fa-solid fa-lock"></i> 锁定 / 清空</div><div class="set-btns"><button class="btn btn-sm btn-outline" onclick="closeModal();lockNow()">锁定</button><button class="btn btn-sm btn-danger" onclick="wipeAll()">清空</button></div></div>
    </div>`);
}
function openPwdModal(){
  openModal(`<h3><i class="fa-solid fa-key"></i> 修改主密码</h3>
    <p class="modal-hint">修改后数据会以新密码重新加密（无需输入旧密码）。</p>
    <div class="form-row"><input id="np1" type="password" inputmode="numeric" placeholder="新数字密码(4-12位)"><input id="np2" type="password" inputmode="numeric" placeholder="确认新密码"></div>
    <div class="form-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="changePassword()">修改</button></div>`);
}
function exportData(){ const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='memo-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click(); toast('已导出备份','success'); }
function importData(){
  const f=$('importFile').files[0]; if(!f){toast('请先选择文件','error');return;}
  const reader=new FileReader(); reader.onload=()=>{
    try{ const data=JSON.parse(reader.result); const merge=k=>{const m=new Map(state[k].map(x=>[x.id,x]));(data[k]||[]).forEach(x=>m.set(x.id,x));state[k]=[...m.values()];}; merge('memos');merge('banks');merge('stocks');merge('todos'); save();renderAll();closeModal();toast('导入完成','success'); }catch(e){toast('文件格式错误','error');}
  }; reader.readAsText(f);
}
/* 系统通知（Notification API） */
let notifyPerm='default';
function refreshNotifyPerm(){ try{ notifyPerm=(typeof Notification!=='undefined')?Notification.permission:'denied'; }catch(e){ notifyPerm='denied'; } }
function requestNotify(){ if(typeof Notification==='undefined'){toast('当前环境不支持系统通知','error');return;} Notification.requestPermission().then(p=>{ notifyPerm=p; if(p==='granted'){ notify('综合备忘录','系统通知已开启 ✓'); toast('通知已开启','success'); } else toast('未授权系统通知','error'); openSettings(); }); }
function notify(title,body){ try{ if(typeof Notification!=='undefined'&&Notification.permission==='granted'){ new Notification(title,{body:body||''}); } }catch(e){} }
async function changePassword(){
  const p1=$('np1').value,p2=$('np2').value;
  if(!/^\d+$/.test(p1)){toast('密码只能是数字','error');return;}
  if(p1.length<PIN_MIN){toast(`至少 ${PIN_MIN} 位`,'error');return;} if(p1!==p2){toast('两次输入不一致','error');return;}
  const salt=crypto.getRandomValues(new Uint8Array(16)); vaultSalt=salt; cryptoKey=await deriveKey(p1,salt);
  const rec=await encryptObj(state,cryptoKey); await idbPut(VAULT_KEY,{salt:b64enc(salt),pinLen:p1.length,...rec}); vaultPinLen=p1.length; closeModal();toast('密码已修改','success');
}
function wipeAll(){ confirmDialog('清空所有数据','将删除全部备忘、银行卡、笔记，且无法恢复。确定吗？').then(ok=>{if(!ok)return;idbDel(VAULT_KEY).then(()=>{toast('已清空，请重新设置密码');lockNow();});}); }

/* 悬浮新建：当前模块直接新增 */
$('fab').onclick=()=>{ if(currentTab==='todo')openTodoForm(); else if(currentTab==='bank')openBankForm(); else if(currentTab==='stock')openStockForm(); else openMemoForm(); };

/* 渲染 */
function renderAll(){ cleanupTrash(); greet(); renderTodos();renderCheckins();renderMemoTags();renderMemos();renderBanks(); if(currentTab=== 'bank'){renderBankFilter();renderOwnerFilter();} if(currentTab=== 'stock')renderStockTags(); renderStocks(); }

/* 启动 */
initTheme(); initLock(); setupTodoDnD(); refreshNotifyPerm();

/* 右上角设置按钮 */
$('settingsBtnTop').onclick=()=>{ openSettings(); };

/* PWA service worker 注册（需通过 http/https 访问，file:// 下不会生效） */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(err=>console.log('SW register skipped:',err));
  });
}
</script>
